name: Publish to npm

on:
  push:
    # release tags are strict semver, e.g. 0.1.0 or 0.1.0-alpha.1
    # (optionally with a leading v); anything else — incl. branch tags — never triggers
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write # bump commit for the package.json version sync on main
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # all tags, so a manual run can find the latest release tag
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Resolve release version
        run: |
          SEMVER='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag push: the pushed tag is the release
            VERSION="${GITHUB_REF_NAME#v}"
            echo "$VERSION" | grep -Eq "$SEMVER" || { echo "::error::tag $GITHUB_REF_NAME is not a release tag (strict semver only, branch tags ignored)"; exit 1; }
          else
            # manual run: highest semver tag wins; non-semver tags (branch tags) are ignored
            VERSION=$(git tag --list | grep -E "$SEMVER" | sed 's/^v//' | sort -V | tail -n1)
            [ -n "$VERSION" ] || { echo "::error::no release tag found (strict semver only)"; exit 1; }
          fi
          # uppercase: bash env vars are case-sensitive and the next step reads $VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release version: $VERSION"
      - name: Sync package.json version on main
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            # commit the bump to the default branch, independent of the tag's commit
            git fetch origin main --depth=1
            git checkout -q -B version-sync origin/main
            npm version "$VERSION" --no-git-tag-version
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "chore(release): v$VERSION"
            git push origin version-sync:main
            git checkout -q "$GITHUB_REF_NAME" 2>/dev/null || true
            echo "main package.json synced to $VERSION"
          else
            echo "main package.json already at $VERSION"
          fi
      - name: Set package version for publish
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi
      - name: Validate package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance
